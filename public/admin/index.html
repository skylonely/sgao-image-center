<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>SGAO Image Center</title>
		<link rel="stylesheet" href="/admin/app.css" />
	</head>

	<body>
		<main class="page">
			<header class="page-header">
				<div>
					<!-- <p class="eyebrow">SGAO</p> -->
					<h1>Image Center</h1>
					<!-- <p class="subtitle">上传图片到 Cloudflare R2，并生成 img.sgao.cc 地址。</p> -->
				</div>
				<a class="header-link" href="/admin/files/">管理文件 →</a>
			</header>

			<section class="panel">
				<div class="field">
					<label for="token">上传密钥</label>
					<input id="token" type="password" placeholder="请输入 UPLOAD_TOKEN" autocomplete="off" />
					<p class="help-text">密钥仅保存在当前浏览器标签页，关闭标签页后清除。</p>
				</div>

				<div class="field">
					<label for="folder">保存目录</label>
					<select id="folder">
						<option value="common">common</option>
						<option value="blog">blog</option>
						<option value="docs">docs</option>
						<option value="logo">logo</option>
					</select>
				</div>

				<div id="dropZone" class="drop-zone" tabindex="0" role="button">
					<div class="drop-icon">＋</div>
					<strong>拖动图片到这里</strong>
					<span>或点击选择图片，可一次选择多张</span>
					<small>JPEG、PNG、WebP、GIF、SVG · 单张最大 10 MB</small>

					<input id="fileInput" type="file" accept=".jpg,.jpeg,.png,.webp,.gif,.svg,image/jpeg,image/png,image/webp,image/gif,image/svg+xml" multiple />
				</div>

				<div id="fileList" class="file-list"></div>

				<button id="uploadButton" class="primary-button">开始上传</button>

				<div id="status" class="status"></div>
			</section>
		</main>

		<div id="conflictDialog" class="modal-backdrop" hidden>
			<div class="delete-dialog conflict-dialog" role="dialog" aria-modal="true" aria-labelledby="conflictTitle" aria-describedby="conflictDescription">
				<div class="conflict-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24">
						<path d="M12 8v4m0 4h.01M5 4h10l4 4v12H5Z" />
						<path d="M15 4v4h4" />
					</svg>
				</div>
				<h2 id="conflictTitle">发现同名文件</h2>
				<p id="conflictDescription">R2 中已存在这个文件。请选择如何处理，旧图不会被自动覆盖。</p>

				<div class="conflict-file">
					<code id="conflictKey"></code>
					<span id="conflictMeta"></span>
				</div>

				<div class="rename-preview">
					<span>保留两者时将保存为</span>
					<strong id="suggestedFilename"></strong>
				</div>

				<div class="dialog-actions conflict-actions">
					<button id="cancelConflictButton" class="dialog-button" type="button">取消此文件</button>
					<button id="overwriteButton" class="dialog-button overwrite" type="button">覆盖旧图</button>
					<button id="renameButton" class="dialog-button primary-choice" type="button">保留两者</button>
				</div>
			</div>
		</div>

		<script src="/admin/app.js"></script>
	</body>
</html>
