<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="浏览和管理 Image Center 中的图片文件。" />
		<title>文件管理 · SGAO Image Center</title>
		<link rel="stylesheet" href="/admin/app.css" />
	</head>

	<body>
		<main class="page files-page">
			<header class="page-header files-header">
				<div>
					<a class="back-link" href="/admin/">← 返回上传</a>
					<h1>Files</h1>
					<p class="subtitle">浏览、复制和管理 R2 中的图片。</p>
				</div>

				<button id="refreshButton" class="icon-button" type="button" aria-label="刷新文件列表" title="刷新">
					<svg aria-hidden="true" viewBox="0 0 24 24">
						<path d="M20 11a8.1 8.1 0 0 0-15.5-3M4 4v4h4M4 13a8.1 8.1 0 0 0 15.5 3M20 20v-4h-4" />
					</svg>
				</button>
			</header>

			<section id="authPanel" class="panel account-panel">
				<div><strong>图片管理账号</strong><p id="accountStatus" class="help-text" role="status">正在检查登录…</p></div>
				<div class="account-actions"><a id="loginLink" href="/api/login?returnTo=/admin/files/" hidden>登录账号</a><a id="logoutLink" href="/cdn-cgi/access/logout" hidden>退出登录</a><button id="checkAccountButton" type="button">重新检查</button></div>
			</section>

			<section id="manager" class="files-manager" hidden>
				<div class="recycle-tabs" role="group" aria-label="图片管理视图">
					<button id="activeFilesButton" type="button" aria-pressed="true">图片文件</button>
					<button id="trashFilesButton" type="button" aria-pressed="false">回收站</button>
				</div>
				<p id="trashNotice" class="help-text" hidden>回收站不会自动清空。恢复到原路径；同名新图片不会被覆盖。彻底删除后无法恢复。</p>
				<div class="manager-toolbar">
					<div class="search-box">
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<circle cx="11" cy="11" r="7" />
							<path d="m20 20-4-4" />
						</svg>
						<input id="searchInput" type="search" placeholder="搜索文件名或目录" aria-label="搜索文件" />
					</div>

					<div class="manager-meta">
						<p id="fileCount" class="file-count" aria-live="polite"></p>
						<button id="selectVisibleButton" class="toolbar-button" type="button">选择当前</button>
					</div>
				</div>

				<div class="filter-toolbar" role="group" aria-label="图片筛选">
					<div class="filter-field">
						<label for="directoryFilter">目录</label>
						<select id="directoryFilter" aria-describedby="directoryFilterHint">
							<option value="">全部目录</option><option value="root">根目录</option>
						</select>
					</div>
					<div class="filter-field filter-format">
						<label for="formatFilter">图片格式</label>
						<select id="formatFilter">
							<option value="">全部格式</option><option value="jpeg">JPEG（jpg / jpeg）</option>
							<option value="png">PNG</option><option value="webp">WebP</option><option value="gif">GIF</option><option value="svg">SVG</option>
						</select>
					</div>
					<div class="filter-field filter-sort">
						<label for="sortOrder">排序</label>
						<select id="sortOrder">
							<option id="sortTimeDescOption" value="time-desc">上传时间：最新在前</option>
							<option id="sortTimeAscOption" value="time-asc">上传时间：最早在前</option>
							<option value="name-asc">文件名：升序</option><option value="name-desc">文件名：降序</option>
							<option value="size-desc">文件大小：从大到小</option><option value="size-asc">文件大小：从小到大</option>
							<option value="directory">按目录浏览</option>
						</select>
					</div>
					<button id="clearFiltersButton" class="toolbar-button" type="button" disabled>清除筛选</button>
				</div>
				<div class="filter-hint-row">
					<p id="directoryFilterHint" class="help-text">目录选项会随读取补齐；可读取全部目录。</p>
					<button id="loadDirectoriesButton" class="toolbar-button" type="button">读取全部目录</button>
				</div>

				<div id="selectionBar" class="selection-bar" hidden>
					<strong id="selectedCount">已选择 0 个文件</strong>
					<span>单次最多选择 50 个</span>
					<div class="selection-actions">
						<button id="clearSelectionButton" class="toolbar-button" type="button">取消选择</button>
						<button id="batchDeleteButton" class="toolbar-button danger" type="button">删除所选</button>
					</div>
				</div>

				<div id="searchProgress" class="search-progress" hidden>
					<p id="searchProgressText" role="status" aria-live="polite" aria-atomic="true"></p>
					<button id="searchControlButton" class="toolbar-button" type="button">暂停搜索</button>
				</div>
				<div id="managerStatus" class="manager-status" role="status" aria-live="polite"></div>
				<div id="folderList" class="folder-list"></div>

				<button id="loadMoreButton" class="load-more-button" type="button" hidden>加载更多</button>
			</section>
		</main>

		<div id="imagePreview" class="preview-backdrop" hidden>
			<div class="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="previewName">
				<div class="preview-toolbar">
					<div class="preview-heading">
						<strong id="previewName"></strong>
						<span id="previewPosition"></span>
					</div>

					<div class="preview-toolbar-actions">
						<a id="previewOpenLink" class="preview-open-link" href="#" target="_blank" rel="noreferrer">打开原图</a>
						<button id="closePreviewButton" class="preview-close-button" type="button" aria-label="关闭预览">
							<svg aria-hidden="true" viewBox="0 0 24 24">
								<path d="m6 6 12 12M18 6 6 18" />
							</svg>
						</button>
					</div>
				</div>

				<div class="preview-stage">
					<button id="previousPreviewButton" class="preview-nav previous" type="button" aria-label="上一张图片">
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<path d="m15 18-6-6 6-6" />
						</svg>
					</button>

					<img id="previewImage" alt="" />
					<p id="previewError" class="preview-error-message" hidden>图片加载失败</p>

					<button id="nextPreviewButton" class="preview-nav next" type="button" aria-label="下一张图片">
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<path d="m9 18 6-6-6-6" />
						</svg>
					</button>
				</div>
			</div>
		</div>

		<div id="renameDialog" class="modal-backdrop" hidden>
			<form id="renameForm" class="delete-dialog rename-dialog" role="dialog" aria-modal="true" aria-labelledby="renameTitle">
				<div class="rename-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24">
						<path d="m4 20 4.2-1 10.6-10.6a2.1 2.1 0 0 0-3-3L5.2 16Z" />
						<path d="m14.5 6.7 3 3M4 20h16" />
					</svg>
				</div>
				<h2 id="renameTitle">重命名文件</h2>
				<p>文件仍保留在当前目录，扩展名不能修改。</p>

				<label class="rename-label" for="renameInput">新文件名</label>
				<input id="renameInput" type="text" maxlength="255" autocomplete="off" />
				<p id="renameError" class="rename-error" role="alert" hidden></p>

				<div class="dialog-actions">
					<button id="cancelRenameButton" class="dialog-button" type="button">取消</button>
					<button id="confirmRenameButton" class="dialog-button primary-choice" type="submit">保存名称</button>
				</div>
			</form>
		</div>

		<div id="deleteDialog" class="modal-backdrop" hidden>
			<div class="delete-dialog" role="dialog" aria-modal="true" aria-labelledby="deleteTitle" aria-describedby="deleteDescription">
				<div class="danger-icon" aria-hidden="true">
					<svg viewBox="0 0 24 24">
						<path d="M12 9v4m0 4h.01M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0Z" />
					</svg>
				</div>
				<h2 id="deleteTitle">删除这张图片？</h2>
				<p id="deleteDescription">移入回收站后可以恢复。</p>
				<code id="deleteKey"></code>
				<div class="dialog-actions">
					<button id="cancelDeleteButton" class="dialog-button" type="button">取消</button>
					<button id="confirmDeleteButton" class="dialog-button danger" type="button">确认删除</button>
				</div>
			</div>
		</div>

		<div id="toast" class="toast" role="status" aria-live="polite"></div>

		<script src="/admin/auth.js"></script>
		<script src="/admin/files/files.js"></script>
	</body>
</html>
